name: ci
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }

jobs:
  self:
    name: flightdeck (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q tmux zsh fzf man-db
          else brew install tmux zsh fzf; fi
      - run: tests/run.sh

  plugins:
    # Every plugin's tests, against the flightdeck under review.
    name: ${{ matrix.plugin }} against this flightdeck
    strategy:
      fail-fast: false
      matrix: { plugin: [flightdeck-step, flightdeck-cisco, flightdeck-net] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: flightdeck }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/${{ matrix.plugin }}", path: "${{ matrix.plugin }}" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q tmux zsh fzf man-db
      - run: ${{ matrix.plugin }}/tests/run.sh
        env: { FLIGHTDECK: "${{ github.workspace }}/flightdeck" }
