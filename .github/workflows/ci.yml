name: ci
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }

jobs:
  test:
    # This plugin against flightdeck master: both must keep working together.
    name: flightdeck-net with flightdeck master (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: flightdeck-net }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/flightdeck", path: flightdeck }
      - name: deps
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q tmux zsh fzf man-db
          else brew install tmux zsh fzf; fi
      - run: flightdeck-net/tests/run.sh
        env: { FLIGHTDECK: "${{ github.workspace }}/flightdeck" }
