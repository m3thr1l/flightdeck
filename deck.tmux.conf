# deck.tmux.conf — add to ~/.tmux.conf:   source-file ~/.config/deck/deck.tmux.conf

# tmux, not your terminal emulator, owns each pane's scrollback. With mouse
# off, tmux never sees the wheel, so the outer terminal either scrolls its own
# (useless) history of the whole tmux screen or fakes arrow keys.
# With mouse on: wheel over a pane -> that pane enters copy mode and scrolls
# its own history; drag selects within the pane; click focuses; borders drag.
set -g mouse on

# Lines of history kept per pane (default 2000). Applies to panes created
# after this is set, so re-run `deck off; deck`.
set -g history-limit 50000

# Copy -> system clipboard. tmux emits an OSC 52 escape sequence containing
# the text; the terminal emulator you are sitting at puts it on the clipboard.
# It travels inside the terminal stream, so it works over ssh with no X/Wayland
# forwarding. The second line tells tmux to trust that the outer terminal
# understands OSC 52 even if its terminfo entry doesn't advertise it.
set -s  set-clipboard on
set -as terminal-features ',*:clipboard'

# Default behaviour on releasing a drag is copy-and-leave-copy-mode, which
# snaps the pane back to the bottom — maddening while reading a log.
# Copy, keep the selection visible, stay where you are. (q or Esc to leave.)
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
